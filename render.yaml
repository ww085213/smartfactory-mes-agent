services:
  - type: web
    name: smartfactory-mes-agent
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci --prefix backend && npm run prisma:generate --prefix backend && npm ci --prefix frontend && npm run build --prefix frontend
    startCommand: npm run start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: DEMO_MODE
        value: "true"
      - key: PUBLIC_DEMO_MODE
        value: "true"
      - key: BUSINESS_TIMEZONE
        value: Asia/Shanghai
      - key: AUTH_ENABLED
        value: "true"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: SmartFactory@2026
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: deepseek
      - key: LLM_BASE_URL
        value: https://api.deepseek.com
      - key: LLM_MODEL
        value: deepseek-v4-flash
      - key: LLM_API_KEY
        sync: false
