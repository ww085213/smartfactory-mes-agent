services:
  mysql:
    image: mysql:8.4
    container_name: smartfactory-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: smartfactory_mes
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - smartfactory_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  smartfactory_mysql_data:
